[package]
name = "weave-provider-ytdlp"
version = "0.1.0"
edition = "2021"

[dependencies]
weave-core = { path = "../weave-core" }
async-trait = "0.1"
tokio = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
