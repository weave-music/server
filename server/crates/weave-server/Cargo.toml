[package]
name = "weave-server"
version = "0.1.0"
edition = "2021"

[dependencies]
weave-core = { path = "../weave-core" }
weave-provider-local = { path = "../weave-provider-local" }
weave-provider-ytdlp = { path = "../weave-provider-ytdlp" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "sync"] }
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
argon2 = "0.5"
rand = "0.8"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = "9"
base64 = "0.22"
sha2 = "0.10"
url = "2"
