[package]
name = "weave-server"
version = "0.1.0"
edition = "2021"

[dependencies]
weave-core = { path = "../weave-core" }
weave-provider-local = { path = "../weave-provider-local" }
weave-provider-ytdlp = { path = "../weave-provider-ytdlp" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process"] }
axum = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
