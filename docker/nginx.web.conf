map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Vite's build output is content-hashed (e.g. index-BkChf-pT.js) — safe
    # to cache for a year, since any change produces a new filename.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html references the current hashed asset names, so it must
    # always be revalidated rather than cached.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Mirrors vite.config.ts's dev/preview proxy: /api and /rest forward to
    # the backend, with WebSocket upgrade support for /api/playback/ws and
    # /api/jam/:id/ws.
    location /api {
        proxy_pass http://weave-server:4533;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1d;
    }

    location /rest {
        proxy_pass http://weave-server:4533;
        proxy_set_header Host $host;
    }

    # SPA fallback: any other path resolves client-side.
    location / {
        try_files $uri /index.html;
    }
}
