services:
  weave-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "4545:4533"
    volumes:
      - /mnt/tank/media/music:/music:ro
      - weave-config:/config
    restart: unless-stopped

  weave-web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - /mnt/tank/files/projects/weave/clients/web:/app
    ports:
      - "5173:5173"
    # Production build, not the dev server — vite's dev-mode React build is
    # noticeably slower (unminified, no prod optimizations). Rebuild after
    # editing source (npm run build) to pick up changes; this won't live-reload.
    command: sh -c "npm install && npm run build && npm run preview"
    depends_on:
      - weave-server
    restart: unless-stopped

volumes:
  weave-config:
