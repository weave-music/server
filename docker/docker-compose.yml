services:
  weave-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "4545:4533"
    volumes:
      - /mnt/tank/media/music:/music:ro
      - weave-config:/config
    restart: unless-stopped

  weave-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "5173:5173"
    # Production build baked into the image at build time (nginx serving
    # static files + proxying /api and /rest) rather than live npm
    # install/build/preview on every start. Rebuild after editing source:
    # docker compose -f docker/docker-compose.yml up -d --build weave-web
    depends_on:
      - weave-server
    restart: unless-stopped

volumes:
  weave-config:
